<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="side-bar">
        <img class="bigimg" src="photos/bannerpik.jpg" alt="">
        <div class="logobgn">
            <img class="smallimg" src="photos/logo.png" alt="">
        </div>
    </section>
    

    <section class="info">

        <header>
            <h2>
                The Path way to self mastery. Realize your deepest dreams
                and cultivate your self.<br> Sign up and enter the abyss.
            </h2>

            <h2>You know you want to.</h2>
        </header>


        <form action="" method="post">

            <div class="details">

                <h2>Lets do this!</h2>

                <div class="form-row">

                    <div class="form-field">
                        <label for="firstname">FIRST NAME</label>
                        <input type="text" id="firstname" name="firstname">
                    </div>

                    <div class="form-field">
                        <label for="lastname">LAST NAME</label>
                        <input type="text" id="lastname" name="lastname">
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-field">
                        <label for="useremail">EMAIL</label>
                        <input type="email" id="useremail" name="useremail">
                    </div>

                    <div class="form-field">
                        <label for="usernumber">PHONE NUMBER</label>
                        <input type="tel" id="usernumber" name="usernumber">
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-field">
                        <label for="userpass">PASSWORD</label>
                        <input type="password" id="userpass" name="userpass" required minlength="4">
                    </div>

                    <div class="form-field">
                        <label for="userpassconf">CONFIRM PASSWORD</label>
                        <input type="password" id="userpassconf" name="userpassconf" required minlength="4">
                    </div>

                </div>

            </div>


            <div class="footer">
                <button type="button">Create Account</button>

                <p>
                    Already have an account?
                    <a href="#">Log in</a>
                </p>
            </div>

        </form>

    </section>

</body>
</html>
